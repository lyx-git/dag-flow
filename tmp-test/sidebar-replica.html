<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dag-flow 工作流入口按钮 · 对齐测试（复刻宿主侧栏）</title>
<!-- 宿主真实 CSS：从 @deepseek-ai/dsh-client-ui-sidebar/lib/client.js 原样抽取 -->
<link rel="stylesheet" href="./host-sidebar.css">
<style>
  /* dsh-client-ui-theme 实测令牌（亮色系），供宿主 CSS 的 var() 解析 */
  :root{
    --dsw-radius-md:12px;
    --dsw-radius-sm:8px;
    --dsw-alias-border-l3:#0000001f;
    --dsw-alias-button-elevated-fill:var(--dsw-static-neutral-bluish-00);
    --dsw-alias-button-floating-hover:var(--dsw-static-neutral-bluish-75);
    --dsw-alias-label-primary:var(--dsw-static-neutral-bluish-1000);
    --dsw-specific-sidebar-fill:var(--dsw-static-neutral-bluish-50);
    --dsw-alias-interactive-bg-hover:#2631480f;
    --dsw-static-neutral-bluish-00:#fff;
    --dsw-static-neutral-bluish-50:#f9fafb;
    --dsw-static-neutral-bluish-75:#f1f3f5;
    --dsw-static-neutral-bluish-100:#ebeef2;
    --dsw-static-neutral-bluish-200:#e1e5ee;
    --dsw-static-neutral-bluish-750:#43454a;
    --dsw-static-neutral-bluish-800:#353638;
    --dsw-static-neutral-bluish-900:#1b1b1c;
    --dsw-static-neutral-bluish-1000:#0f1115;
  }
  html,body{height:100%}
  body{margin:0;background:#e8ecf2;font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;display:flex;gap:24px;padding:24px;box-sizing:border-box}
  [data-pane="sidebar"]{flex:none}
  .hHd-Xa_root{width:260px;flex:none}
  .report{font:12px/1.7 Consolas,monospace;background:#fff;color:#111;padding:14px 16px;border-radius:10px;align-self:flex-start;min-width:430px;white-space:pre-wrap;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .report b{font-size:13px}
</style>
</head>
<body>
  <div data-pane="sidebar">
    <div class="hHd-Xa_root">
      <div class="hHd-Xa_logoRow" data-window-drag="true">
        <button class="hHd-Xa_brand hHd-Xa_wide" type="button">
          <span class="hHd-Xa_brandIdentity">
            <span class="hHd-Xa_brandMark"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#2b5fd9"/></svg></span>
            <span class="hHd-Xa_brandName">DSH</span>
          </span>
        </button>
        <button class="hHd-Xa_iconButton hHd-Xa_toggle" type="button" aria-label="收起侧边栏">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
      </div>
      <!-- 宿主「新会话」按钮：结构与 dsh-client-ui-sidebar SidebarRoot JSX 一致 -->
      <button class="hHd-Xa_newSession" type="button" aria-label="新建会话">
        <span class="hHd-Xa_newSessionLabelMask"><span class="hHd-Xa_newSessionContent">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="hHd-Xa_newSessionLabel hHd-Xa_wide">新会话</span>
        </span></span>
      </button>
      <!-- dag-flow 工作流入口由真实代码（test-sidebar.js = src/client/sidebar.ts 打包）注入到这里 -->
      <nav class="hHd-Xa_panelList" aria-label="全局面板">
        <button class="hHd-Xa_panelRow" type="button">
          <span class="hHd-Xa_panelGlyph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/><path d="M13 7.5h3.5M16.5 11V7.5M7.5 13v3.5M7.5 16.5H11"/></svg></span>
          <span class="hHd-Xa_panelTitle hHd-Xa_wide">插件</span>
        </button>
      </nav>
      <div class="hHd-Xa_regionArea"></div>
      <div class="hHd-Xa_footArea"></div>
    </div>
  </div>
  <div class="report" id="report">measuring…</div>
  <script src="./test-sidebar.js?v=2"></script>
  <script>
    // 用真实的 dag-flow 代码挂载入口
    window.DagFlowSidebar.mountSidebarEntry(function () {}, '工作流');
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      var hostBtn = document.querySelector('button[class*="newSession"]');
      var entry = document.querySelector('[data-dag-flow-entry]');
      var panel = document.querySelector('[class*="panelRow"]');
      if (!hostBtn || !entry || !panel) {
        document.getElementById('report').textContent = 'FAIL  元素缺失 host=' + !!hostBtn + ' entry=' + !!entry + ' panel=' + !!panel;
        return;
      }
      var cs = function (el) { return getComputedStyle(el); };
      var host = hostBtn.getBoundingClientRect();
      var ent = entry.getBoundingClientRect();
      var pan = panel.getBoundingClientRect();
      var entIcon = entry.querySelector('[data-dag-flow-entry-icon]').getBoundingClientRect();
      var entLabel = entry.querySelector('[data-dag-flow-entry-label]').getBoundingClientRect();
      var hostContent = hostBtn.querySelector('[class*="newSessionContent"]');
      var hostIcon = hostContent.querySelector('svg').getBoundingClientRect();
      var hostLabel = hostContent.querySelector(':scope > span:last-child').getBoundingClientRect();
      var gapAbove = ent.top - host.bottom;
      var gapBelow = pan.top - ent.bottom;
      var entIconGap = entLabel.left - entIcon.right;
      var hostIconGap = hostLabel.left - hostIcon.right;
      var hostCenter = host.left + host.width / 2;
      var entContentCenter = (entIcon.left + entLabel.right) / 2;
      var dbg = (function () {
        var out = [];
        try {
          var csx = cs(hostBtn);
          out.push('cs.radius=' + JSON.stringify(csx.borderRadius) + ' cs.border=' + JSON.stringify(csx.border) + ' cs.borderStyle=' + JSON.stringify(csx.borderStyle));
          var t = document.createElement('button');
          t.style.setProperty('border', csx.border && csx.borderStyle !== 'none' ? csx.border : 'none');
          out.push('after border: inline.radius=' + JSON.stringify(t.style.borderRadius) + ' computed=' + JSON.stringify(cs(t).borderRadius));
          t.style.setProperty('borderRadius', csx.borderRadius);
          out.push('after setRadius: inline.radius=' + JSON.stringify(t.style.borderRadius) + ' computed=' + JSON.stringify(cs(t).borderRadius));
        } catch (e) { out.push('EXC ' + e.message); }
        return out.join(' | ');
      })();
      var checks = [
        ['1a 宽度一致',        Math.abs(ent.width - host.width) <= 1,  'host=' + host.width.toFixed(2) + ' entry=' + ent.width.toFixed(2)],
        ['1b 高度一致',        Math.abs(ent.height - host.height) <= 1, 'host=' + host.height.toFixed(2) + ' entry=' + ent.height.toFixed(2)],
        ['1c 圆角一致且>0',    cs(entry).borderRadius === cs(hostBtn).borderRadius && parseFloat(cs(entry).borderRadius) > 0, 'host=' + cs(hostBtn).borderRadius + ' entry=' + cs(entry).borderRadius + ' inline=' + (entry.style.borderRadius || '(空)')],
        ['2a icon-文字间距一致', Math.abs(entIconGap - hostIconGap) <= 1, 'host=' + hostIconGap.toFixed(2) + ' entry=' + entIconGap.toFixed(2)],
        ['2b 内容整体居中',     Math.abs(entContentCenter - hostCenter) <= 1.5, '偏差=' + (entContentCenter - hostCenter).toFixed(2) + 'px'],
        ['3a 上间隔=下间隔',    Math.abs(gapAbove - gapBelow) <= 1, '上=' + gapAbove.toFixed(2) + ' 下=' + gapBelow.toFixed(2)],
        ['3b 间隔=12px(宿主节奏)', Math.abs(gapAbove - 12) <= 1 && Math.abs(gapBelow - 12) <= 1, '上=' + gapAbove.toFixed(2) + ' 下=' + gapBelow.toFixed(2)]
      ];
      var pass = 0;
      var lines = checks.map(function (c) { if (c[1]) pass++; return (c[1] ? 'PASS' : 'FAIL') + '  ' + c[0] + '   (' + c[2] + ')'; });
      document.getElementById('report').textContent =
        'dag-flow 工作流入口按钮 对齐测试：' + pass + '/' + checks.length + ' PASS\n' + lines.join('\n') + '\nDEBUG: ' + dbg;
    }); });
  </script>
</body>
</html>
