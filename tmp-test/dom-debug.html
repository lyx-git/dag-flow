<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>节点 DOM 结构诊断</title>
<link rel="stylesheet" href="./grab-test.css">
<style>
  body{margin:0;background:#0b1120;color:#e6edf7;font-family:Consolas,monospace}
  #root{position:fixed;inset:0}
  .report{position:fixed;right:12px;top:12px;font:11px/1.6 Consolas,monospace;background:#fff;color:#111;
    padding:12px 14px;border-radius:10px;min-width:600px;max-width:760px;white-space:pre-wrap;z-index:30000;
    max-height:96vh;overflow-y:auto}
</style>
</head>
<body>
<div id="root"></div>
<div class="report" id="report">probing…</div>
<script src="./grab-test.js"></script>
<script>
  var tries = 0;
  (function whenReady() {
    var e = document.querySelector('.dsh-wf-fg-editor');
    var nds = e ? e.querySelectorAll('.dsh-wf-fg-node') : [];
    if (nds.length >= 2) return void setTimeout(run, 500);
    if (tries++ < 120) return void setTimeout(whenReady, 50);
    document.getElementById('report').textContent = 'timeout';
  })();
  function run() {
    var out = [];
    var node = document.querySelector('.dsh-wf-fg-node');
    function describe(el, depth) {
      if (!el || depth > 4) return;
      var cls = String(el.className || '').split(' ').filter(Boolean).slice(0, 4).join('.');
      var ds = Object.keys(el.dataset || {}).map(function (k) { return k + '=' + el.dataset[k]; }).join(',');
      out.push('  '.repeat(depth) + '<' + el.tagName.toLowerCase() + '> ' + cls + (ds ? '  [' + ds + ']' : ''));
      if (depth < 2) Array.prototype.forEach.call(el.children, function (c) { describe(c, depth + 1); });
    }
    describe(node, 0);
    out.push('');
    out.push('host exists: ' + !!document.querySelector('.dsh-wf-fg-node-host'));
    out.push('node count: ' + document.querySelectorAll('.dsh-wf-fg-node').length);
    out.push('node outerHTML(前400): ' + node.outerHTML.slice(0, 400));
    document.getElementById('report').textContent = out.join('\n');
  }
</script>
</body>
</html>
